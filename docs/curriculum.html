 a Stock Operator\",\"author\":\"Edwin Lefevre\",\"level\":2,\"tracks\":[\"fundamental\",\"practitioner\"],\"topics\":[\"the-canon\",\"markets-and-execution\"],\"description\":\"The thinly veiled biography of Jesse Livermore. Timeless lessons on speculation, crowd psychology, and the art of tape reading.\",\"keyConcepts\":[\"Speculation psychology\",\"Tape reading\",\"Position sizing\",\"Market timing\",\"Crowd behavior\"]},{\"slug\":\"druckenmiller-principles\",\"title\":\"Druckenmiller: Principles from Practice\",\"author\":\"Stanley Druckenmiller (via Schwager, interviews)\",\"level\":2,\"tracks\":[\"macro\",\"practitioner\"],\"topics\":[\"the-canon\",\"economics-and-macro\",\"markets-and-execution\"],\"description\":\"The greatest macro trader of his generation never wrote a book. Synthesized from three decades of interviews, conference talks, and Schwager's New Market Wizards: concentration, liquidity, fat pitches, and radical flexibility.\",\"keyConcepts\":[\"Concentration over diversification\",\"Liquidity as primary driver\",\"Fat pitch sizing\",\"Top-down macro framework\",\"Intellectual flexibility\"]},{\"slug\":\"graham-value-investing\",\"title\":\"Security Analysis \u0026 The Intelligent Investor\",\"author\":\"Benjamin Graham\",\"level\":2,\"tracks\":[\"fundamental\"],\"topics\":[\"the-canon\"],\"description\":\"The father of value investing. Graham's framework for margin of safety, intrinsic value, Mr. Market, and the distinction between investment and speculation.\",\"keyConcepts\":[\"Margin of safety\",\"Intrinsic value\",\"Mr. Market\",\"Investment vs. speculation\",\"Net-net investing\"]},{\"slug\":\"engines-that-move-markets\",\"title\":\"Engines That Move Markets\",\"author\":\"Alasdair Nairn\",\"level\":2,\"tracks\":[\"fundamental\",\"macro\"],\"topics\":[\"the-canon\",\"economics-and-macro\"],\"description\":\"The recurring pattern of technology-driven investment booms and busts: railroads, radio, automobiles, electronics, and the internet. How transformative industries create and destroy fortunes through predictable cycles.\",\"keyConcepts\":[\"Technology adoption S-curves\",\"Innovation boom-bust cycles\",\"Capital misallocation\",\"Transformative vs. incremental innovation\",\"Investor psychology in tech revolutions\"]},{\"slug\":\"lynch-one-up-on-wall-street\",\"title\":\"One Up on Wall Street\",\"author\":\"Peter Lynch\",\"level\":2,\"tracks\":[\"fundamental\"],\"topics\":[\"the-canon\"],\"description\":\"The greatest mutual fund manager explains growth at a reasonable price, stock categorization (fast growers, stalwarts, turnarounds, cyclicals), tenbaggers, and why amateur investors can beat professionals.\",\"keyConcepts\":[\"GARP\",\"Tenbaggers\",\"Stock categorization\",\"Invest in what you know\",\"The amateur edge\",\"PEG ratio\"]},{\"slug\":\"tudor-jones-principles\",\"title\":\"Paul Tudor Jones: The Art of Macro Trading\",\"author\":\"Paul Tudor Jones (via Schwager, interviews, \\\"Trader\\\" documentary)\",\"level\":2,\"tracks\":[\"practitioner\",\"macro\"],\"topics\":[\"the-canon\",\"markets-and-execution\",\"economics-and-macro\"],\"description\":\"The greatest risk manager in macro trading history. Synthesized from the 1987 \\\"Trader\\\" documentary, Schwager's Market Wizards, and three decades of interviews: defense first, 200-day moving average, tape reading, asymmetric payoffs, and the 1987 crash trade.\",\"keyConcepts\":[\"Defense over offense\",\"200-day moving average\",\"Asymmetric risk/reward\",\"Tape reading\",\"1987 crash trade\",\"Losers average losers\"]},{\"slug\":\"schwager-market-wizards\",\"title\":\"Market Wizards\",\"author\":\"Jack Schwager\",\"level\":2,\"tracks\":[\"practitioner\",\"fundamental\",\"macro\"],\"topics\":[\"the-canon\",\"markets-and-execution\"],\"description\":\"Jack Schwager's interviews with the greatest traders of the 20th century. Discretionary and systematic, fundamental and technical — the common threads of risk management, discipline, and edge that separate survivors from blowups.\",\"keyConcepts\":[\"Risk management discipline\",\"Trading psychology\",\"Edge identification\",\"Position sizing\",\"Cutting losses\",\"Letting winners run\",\"Process over outcome\"]},{\"slug\":\"taleb-incerto\",\"title\":\"Incerto: Fooled by Randomness, Black Swan, Antifragile\",\"author\":\"Nassim Nicholas Taleb\",\"level\":2,\"tracks\":[\"fundamental\",\"quantitative\"],\"topics\":[\"the-canon\",\"quantitative-methods\"],\"description\":\"Taleb's philosophical and mathematical framework for navigating uncertainty, fat tails, and the limits of prediction. Why most risk models are wrong and what to do about it.\",\"keyConcepts\":[\"Fat tails\",\"Black swans\",\"Antifragility\",\"Narrative fallacy\",\"Skin in the game\",\"Ludic fallacy\"]}]}}]}],[\"$\",\"$L4\",\"3\",{\"delay\":0.1,\"children\":[\"$\",\"$L5\",null,{\"level\":{\"number\":3,\"title\":\"Macro \u0026 Monetary Theory\",\"description\":\"Keynes, Hayek, Friedman, Soros, and the psychology of markets\",\"items\":[{\"slug\":\"keynes-general-theory\",\"title\":\"The General Theory of Employment, Interest, and Money\",\"author\":\"John Maynard Keynes\",\"level\":3,\"tracks\":[\"macro\"],\"topics\":[\"the-canon\",\"economics-and-macro\"],\"description\":\"The book that reshaped economics. Keynes on aggregate demand, liquidity preference, the multiplier, and why markets don't always self-correct.\",\"keyConcepts\":[\"Aggregate demand\",\"Liquidity preference\",\"The multiplier\",\"Animal spirits\",\"Paradox of thrift\"]},{\"slug\":\"hayek-prices-and-production\",\"title\":\"Prices and Production\",\"author\":\"Friedrich Hayek\",\"level\":3,\"tracks\":[\"macro\"],\"topics\":[\"the-canon\",\"economics-and-macro\"],\"description\":\"Hayek's counter to Keynes: how credit expansion distorts the structure of production and inevitably leads to bust. The Austrian business cycle theory.\",\"keyConcepts\":[\"Austrian business cycle theory\",\"Structure of production\",\"Credit expansion\",\"Malinvestment\",\"Natural rate of interest\"]},{\"slug\":\"soros-reflexivity\",\"title\":\"The Alchemy of Finance \u0026 Reflexivity\",\"author\":\"George Soros\",\"level\":3,\"tracks\":[\"macro\",\"practitioner\"],\"topics\":[\"the-canon\",\"economics-and-macro\"],\"description\":\"Soros' theory of reflexivity: feedback loops between market prices and fundamentals that create boom-bust cycles. The philosophical foundation behind the Quantum Fund.\",\"keyConcepts\":[\"Reflexivity\",\"Boom-bust cycles\",\"Fallibility\",\"Two-way feedback\",\"Real-time experiment\"]},{\"slug\":\"behavioral-finance\",\"title\":\"Behavioral Finance: Kahneman, Tversky \u0026 Beyond\",\"author\":\"Kahneman, Tversky, Thaler\",\"level\":3,\"tracks\":[\"fundamental\",\"quantitative\",\"macro\"],\"topics\":[\"the-canon\",\"economics-and-macro\"],\"description\":\"The psychological foundations of market behavior. Prospect theory, loss aversion, anchoring, overconfidence, and the systematic biases that create mispricings.\",\"keyConcepts\":[\"Prospect theory\",\"Loss aversion\",\"Anchoring\",\"Overconfidence\",\"Disposition effect\",\"Herd behavior\"]},{\"slug\":\"friedman-monetary-theory\",\"title\":\"Monetarism: Friedman \u0026 Schwartz\",\"author\":\"Milton Friedman\",\"level\":3,\"tracks\":[\"macro\"],\"topics\":[\"the-canon\",\"economics-and-macro\"],\"description\":\"The monetarist counter-revolution. Friedman's reinterpretation of the Great Depression, the natural rate of unemployment, the permanent income hypothesis, and the case for rules-based monetary policy.\",\"keyConcepts\":[\"Quantity theory of money\",\"Natural rate of unemployment\",\"Permanent income hypothesis\",\"K-percent rule\",\"Inflation expectations\",\"Monetary contraction and the Great Depression\"]}]}}]}],[\"$\",\"$L4\",\"4\",{\"delay\":0.15000000000000002,\"children\":[\"$\",\"$L5\",null,{\"level\":{\"number\":4,\"title\":\"Valuation\",\"description\":\"Intrinsic value, relative value, and Damodaran's toolkit\",\"items\":[{\"slug\":\"damodaran-little-book-valuation\",\"title\":\"The Little Book of Valuation\",\"author\":\"Aswath Damodaran\",\"level\":4,\"tracks\":[\"fundamental\",\"quantitative\"],\"topics\":[\"the-canon\"],\"description\":\"Damodaran distills valuation into its essentials: intrinsic value, relative value, and the stories that connect numbers to narratives.\",\"keyConcepts\":[\"Intrinsic valuation\",\"Relative valuation\",\"DCF models\",\"Cost of capital\",\"Narrative and numbers\"]},{\"slug\":\"growth-investing-principles\",\"title\":\"Growth Investing: Principles \u0026 Frameworks\",\"author\":\"Various (Fisher, Lynch, Nairn, Christensen)\",\"level\":4,\"tracks\":[\"fundamental\"],\"topics\":[\"the-canon\"],\"description\":\"A synthesis of growth investing frameworks: TAM analysis, unit economics, S-curves, disruption theory, PEG ratios, Rule of 40, and the art of identifying compounders before the market prices them in.\",\"keyConcepts\":[\"TAM/SAM/SOM\",\"Unit economics\",\"S-curves\",\"Disruption theory\",\"PEG ratio\",\"Rule of 40\",\"Compounder identification\"]},{\"slug\":\"technical-analysis\",\"title\":\"Technical Analysis: Price Action, Patterns \u0026 Indicators\",\"author\":\"Edwards \u0026 Magee, Nison, Murphy, Chaikin\",\"level\":4,\"tracks\":[\"practitioner\",\"fundamental\"],\"topics\":[\"the-canon\",\"markets-and-execution\"],\"description\":\"The complete technical toolkit: Dow Theory, chart patterns, candlesticks, moving averages, RSI, MACD, Bollinger Bands, Chaikin Money Flow, volume analysis, and the honest debate about when technicals work and when they don't.\",\"keyConcepts\":[\"Dow Theory\",\"Chart patterns\",\"Candlestick analysis\",\"Moving averages\",\"RSI\",\"MACD\",\"Chaikin Money Flow\",\"Volume confirmation\",\"Support and resistance\"]}]}}]}],[\"$\",\"$L4\",\"5\",{\"delay\":0.2,\"children\":[\"$\",\"$L5\",null,{\"level\":{\"number\":5,\"title\":\"Quantitative Foundations\",\"description\":\"Math, statistics, and econo
